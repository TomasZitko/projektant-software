[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projektant-copilot"
version = "0.1.0"
description = "AI-Powered Building Code Compliance Engine for Revit"
authors = [
    {name = "Projektant Team", email = "dev@projektant.ai"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "neo4j>=5.16.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",

    # RAG & ML
    "openai>=1.10.0",
    "pinecone-client>=3.0.0",
    "tiktoken>=0.5.2",
    "tenacity>=8.2.3",

    # PDF Processing
    "pdfplumber>=0.10.3",
    "pypdf2>=3.0.1",

    # Text Processing
    "scikit-learn>=1.4.0",
    "numpy>=1.26.3",
    "scipy>=1.12.0",

    # Computer Vision (for Part 2B)
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.9.0",
    "pillow>=10.2.0",

    # Graph Processing
    "networkx>=3.2.1",
    "torch-geometric>=2.5.0",

    # HTTP & Async
    "httpx>=0.26.0",
    "aiohttp>=3.9.1",
    "redis>=5.0.1",

    # Monitoring & Logging
    "sentry-sdk>=1.40.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",

    # Development
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.14",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.20.0",
    "jupyter>=1.0.0",
    "pytest-watch>=4.2.0",
    "httpx>=0.26.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
